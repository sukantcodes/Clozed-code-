name: Build Android APK
run-name: ${{ github.event.inputs.taskName || 'assembleDebug' }} @ ${{ github.ref_name }}

# Builds THIS repository. GitHub's ubuntu-latest image already ships the
# Android SDK, so nothing needs to be downloaded except Gradle + dependencies.
on:
  workflow_dispatch:
    inputs:
      jdkVersion:
        description: "OpenJDK version (this project needs 17)"
        required: false
        default: "17"
      taskName:
        description: "Gradle task: assembleDebug or assembleRelease"
        required: false
        default: "assembleDebug"
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdkVersion || '17' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Locate the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK"
          ls "$SDK" || true
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Ensure platform 35 and build-tools 35 are installed
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Generate the Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build
        env:
          TASK: ${{ github.event.inputs.taskName || 'assembleDebug' }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          SIGNING_ARGS=()

          if [[ "$TASK" == *Release* ]]; then
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkey -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "C=US, O=Android, CN=Android Debug"
            fi
            SIGNING_ARGS=(
              "-Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore"
              "-Pandroid.injected.signing.store.password=android"
              "-Pandroid.injected.signing.key.alias=androiddebugkey"
              "-Pandroid.injected.signing.key.password=android"
            )
          fi

          set +e
          ./gradlew "$TASK" "${SIGNING_ARGS[@]}" --stacktrace --no-daemon 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            {
              echo "## :x: Build failed — \`$TASK\` (exit $STATUS)"
              echo ""
              echo "### What went wrong (80 lines after the marker)"
              echo '```'
              sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$LOG" | awk '/What went wrong:/{p=1;n=0} p{print;n++} n>80{exit}'
              echo '```'
              echo "### Resource / Kotlin errors"
              echo '```'
              grep -nE "Android resource linking failed|ERROR:|^e: |error:|Caused by:|> " "$LOG" | head -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clozed-code-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7